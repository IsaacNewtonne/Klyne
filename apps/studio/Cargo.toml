[package]
name = "klyne-studio"
version = "0.1.0"
edition = "2024"
default-run = "klyne-studio"

[dependencies]
tokio = { version = "1.53.1", features = ["rt", "time", "net"] }
sha2 = "0.10"
harness-browser = { path = "../../crates/harness-browser" }
harness-core = { path = "../../crates/harness-core" }
harness-experiment = { path = "../../crates/harness-experiment" }
harness-provider = { path = "../../crates/harness-provider" }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls-webpki-roots"] }
serde = { version = "1.0.229", features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.151"

[dev-dependencies]
tempfile = "3"
